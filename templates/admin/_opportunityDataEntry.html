        <!-- form needs these data: 
        * selected_opportunity
        * opportunity_name
        * opportunity
        * organizations
        * current_organization
        -->
<div>
    <form id="opportunityDataEntryForm" 
        enctype="multipart/form-data"
        hx-post="/opportunity-details" 
        hx-target="#opportunity_details" 
        hx-swap="innerHTML">
        <input type="hidden" name="opportunity_name" value="{{ opportunity_name }}">
        <label for="organization_name">Organization:</label>
        <select id="organization_name"
            name="organization_name"
            class="select" 
            data-tags="true"
            >
            <option value="">{{ selected_opportunity }}</option>

            {% for organization in organizations %} 
                <option value="{{ organization[0] }}" 
                        {% if current_organization and organization[0] == current_organization[0] %}selected {% endif %}]>
                    {{ organization[0] }}
                </option>
            {% endfor %}
        </select><br>
        <!-- input for logo upload in case it's a new organization -->
        <label for="logo-upload">Upload organization logo (optional):</label>
        <input type="file" name="logo" accept="image/*" id="logo-upload"><br>
        <label for="opportunity_description">Opportunity description:</label>
        <textarea id="opportunity_description"
            name="opportunity_description">{{ opportunity[3] if opportunity else ''}}
        </textarea><br>
        <label for="website_url">Opportunity website:</label>
        <input type="text" id="website_url" name="website_url" value="{{ opportunity[2] if opportunity else '' }}"><br>
        <input id="submit_opportunity_data" 
            type="submit" 
            value="Submit">
        <div class="easy-tap-button-container">
            <button type="button" onclick="clearDetailsForm()">Clear form</button> <!-- clear form just blanks out the values in each area -->            
        </div>
        {% if opportunity %}
            <!-- Editing an existing opportunity: clearing discards edits, returns to the static view -->
        <div class="easy-tap-button-container">
            <button type="button" 
                    hx-get="/opportunity-details" 
                    hx-vals='{"opportunity_name": "{{ opportunity_name }}" }'
                    hx-target="#opportunity_details"
                    hx-swap="innerHTML"
                    hx-confirm="Are you sure you wish to cancel editing?">Cancel
            </button>            
        </div>
        {% else %}
        <div class="easy-tap-button-container">
            <!-- Brand-new opportunity: clearing abandons entry entirely, nothing to show -->
            <button type="button" 
                    onclick="if(confirm('Are you sure you wish to cancel entry?')) 
                    {document.getElementById('opportunity_details').innerHTML = '';
                    document.getElementById('opportunity_name').tomselect.clear(true);}"
                    >
                Cancel
            </button>            
        </div>
        {% endif %}
    </form>
    <script>
        // Check if an instance already exists on the organization_name select element and destroy it if it does
        if (document.getElementById('organization_name').tomselect) {
            document.getElementById('organization_name').tomselect.destroy();
        }
        var orgSelect = new TomSelect("#organization_name", {
            maxItems:1,
            plugins:['clear_button'],
            persist: false,
            create: true,
            addPrecedence: true,            
            refreshThrottle: 0, // Forces instant dropdown updates as you type
            placeholder: "Enter the organization name",
            selectOnTab: true, // Allows new entries to be added to the top of the list

        });
        function clearDetailsForm() {
            document.getElementById('opportunity_description').value = '';
            document.getElementById('website_url').value = '';
            orgSelect.clear();
            document.getElementById('submit_opportunity_data').disabled = true;
        }
        function confirmCancel() {
            confirm("Are you sure you wish to cancel editing?");
        }
    </script>
</div>
